<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CONTACTO</title>
</head>
<body>
  <main>
    <div>
    <h1>Titulo del Contacto</h1>
    <form action="">
      <fieldset> 
        <legend>Titulo de Contacto</legend>
      <label  for="nombre">Nombre:</label>
      <input type="text" name="name" id="name" required>  
    </div>
  <br>
    <div>
      <label for="apellido">Apellido:</label>
      <input type="text" name="apellido" id="apellido" required>
    </div>
    <br>
    <div>
      <label for="edad">Edad</label>
      <input type="number" step="1" max="100" required>
    </div>
    <br>
    <div><label for="correo">Correo</label>
    <input type="text" name="correo" id="correo" required >
    </div>
  <br>
  <div><label for="fecha">Fecha de nacimiento</label>
  <input type="date" name="fecha" id="fecha"></div>
 <button>GUARDAR</button>
</body>
</html>
